name: lint

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling + deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest motor python-dotenv aiohttp psutil pyrofork

      - name: Syntax check (compileall)
        run: python -m compileall -q bot plugins database.py update.py verify_ffmpeg_cmd.py

      - name: Ruff (errors only)
        run: ruff check . --select E9,F63,F7,F82,F401 --ignore F401 --exit-zero

      - name: Unit tests
        run: |
          export TG_BOT_TOKEN=test APP_ID=1 API_HASH=test DATABASE_URL="mongodb://localhost:27017"
          python verify_ffmpeg_cmd.py
          pytest tests/ -q
